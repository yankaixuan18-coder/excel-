# ============================================================================
# 腾讯文档「周利润表」自动复制行工具 —— 配置示例
#
# 用法: 复制本文件为 config.toml, 按注释填写。
#   cp config.example.toml config.toml
# config.toml 含密钥, 已被 .gitignore 忽略, 不会提交。
# ============================================================================

[app]
# ============ 方式一(推荐, 最简单) ============
# 直接到开放平台「开发者信息」页, 把这三个值复制过来即可, 不需要 client_secret、
# 也不需要跑 `python run.py auth`。
#   access_token 有效期约 30 天, 过期了回那个页面重新复制粘贴一次就行。
client_id    = "粘贴 client_id(应用ID)"
access_token = "粘贴 access_token"
open_id      = "粘贴 open_id"

# ============ 方式二(可选, 走 OAuth 授权码流程时才需要) ============
# 如果你不用上面的直填 token, 而是走浏览器授权, 才需要下面这些; 否则留空即可。
# client_secret = "你的_client_secret"
# redirect_uri  = "http://localhost:8888/callback"
# scope         = "all"
# token_cache   = ".td_token.json"

# --- 下面这些 URL 一般不用改; 若官方接口改版, 在此集中调整(见 docs/API_NOTES.md) ---
# oauth_authorize_url = "https://docs.qq.com/oauth/v2/authorize"
# oauth_token_url     = "https://docs.qq.com/oauth/v2/token"
# oauth_userinfo_url  = "https://docs.qq.com/oauth/v2/userinfo"
# api_base            = "https://docs.qq.com/openapi"

# ====== 自动填数(可选) ======
# 每周从领星ERP等导出数据表 xlsx, 放到固定路径, 复制后按 ASIN+站点 自动填进新块。
# 留空则关闭填数, 只做"复制行+填日期"。
# data_table = "data/weekly.xlsx"
#
# 列映射: {表格列字母 = 数据表字段名}。所有 target 共用这一份(可被 target 内 fill_map 覆盖)。
# 字段名取自数据表表头, 可用的有: inventory, sales_volume, order_quantity,
# replacement_quantity, sales_revenue, sessions_total, ads_exposure, ads_click,
# ads_spend, ads_revenue, ads_order, refund_quantity, number_of_reviews ... (共48个)
# 注意: 表格里是公式的列(转化率/CPC/ROAS等)即使写在这里也不会被覆盖, 仍用公式自动算。
# [app.fill_map]
# F = "inventory"        # 库存
# G = "sales_volume"     # 销量
# H = "order_quantity"   # 订单
# J = "sales_revenue"    # 销售额
# ... 按你表格的真实列继续补


# ============================================================================
# 要处理的子表(标签页)。每个 [[targets]] 是一个 sheet。
# 你截图里有 4 个店铺标签(伍纺源/昕亦/光伊/春知处), 就配 4 个 [[targets]]。
# ============================================================================

[[targets]]
name      = "光伊"            # 随便起的名字, 命令行 --target 用它
book_id   = "文档ID"          # 取自文档链接 https://docs.qq.com/sheet/<book_id>
sheet_id  = "子表ID"          # 子表ID, 见 docs/SETUP.md 获取方法

date_col   = "A"             # 日期所在列。日期格式两种都自动识别: 6.7-6.13 或 6.7-13,
                             # 新日期会沿用你这张表的写法
marker_col = "B"             # 用来定位"父ASIN"行和块末行的列(块内每行都有值, 一般是 SKU 列)
parent_text = "父ASIN"        # 块首那一行在 marker_col 里的文字标记(一般就是"父ASIN", 不用改)
first_col  = "A"             # 复制时读写的起始列
last_col   = "AL"            # 复制时读写的结束列(覆盖到你最右边的数据列, 如 BM)

# 指定留空的列(开了自动填数后, 数据列会被自动填, 这里通常可留空 [])。
# 公式单元格永远保留并平移(如父ASIN 汇总行的 SUM), 多写几列也不会误伤公式。
clear_cols = []

# 整行复制时, 此列及其右边的列全部清空(每周手填的备注: 比价方案/效果/改动内容)。
clear_from_col = "BC"

# --- 自动填数相关(开了 data_table 才生效) ---
asin_col     = "D"          # ASIN 所在列(用于匹配数据表)
country_code = "CA"         # 站点代码(CA/US/UK/FR/DE/IT/ES); 留空则从标签名前缀(如"CA外卖包")推断
# country    = "加拿大"      # 也可直接写中文站点名, 优先级最高
# fill_map   = { F="inventory", G="sales_volume" }  # 仅本表的列映射, 覆盖全局 [app.fill_map]

year       = 2026            # 日期所在年份(用于跨月/跨年推算); 不填则默认当前年
step_days  = 7              # 每块间隔天数(周报 = 7)

# 再来一个标签页/店铺的例子(按需复制多份, 用 run --all 一次跑完):
# [[targets]]
# name      = "披萨包-王倩"   # 名字无 CA 前缀 => 站点默认 美国
# book_id   = "..."
# sheet_id  = "..."
# last_col  = "BE"
# clear_from_col = "BC"
# asin_col  = "D"
